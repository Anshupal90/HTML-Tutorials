<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1> Registration Form</h1>
<h3>Personal information</h3>
<label>name:</label>
<input type="text" placeholder="enter name">
<br><br>
<label>Address:</label>
<input type="text" placeholder="enter your address">
<br><br>
<label>enter date of birth</label>
<input type="text" placeholder="enter your date of birth">    
<br><br>
<label>select gender</label>
<select name=ender">
    <option value="male">male</option>
    <option value="female">female</option>
</select>
<br>
<h3>contact me</h3>
<label>mobile no:</label>
<input type="text" placeholder="mobile no">
<br><br>
<label>email id:</label>
<input type="text" placeholder="email id">
<br>
<h3>select your job role</h3>
<select name="job role">
    <option value="data analysis">data analysis</option>
    <option value="software engineer">software engineer</option>
    <option value="web development">web development</option>
    <option value="python developer">python developer</option>
</select>
<br>
<h3>select your skills</h3>
<input type="checkbox" name="skills" value="python">
<label>python</label>
<br>
<input type="checkbox" name="skills" value="HTML">
<label>HTML</label>
<br>
<input type="checkbox" name="skills" value="java">
<label>java</label>
<br>
<input type="checkbox" name="skills" value="sql">
<label>sql</label>
<br>
<h3>education</h3>
<select name="education">
    <option value="12th">12th</option>
    <option value="BSc">BSc</option>
    <option value="MSC,MCA">MSC,MCA</option>
</select>
<br><br>
<label>resume upload</label>
<input type="file" name="resume" accept="pdf, .doc, .docx">
<br><br>
<label for="cover letter">cover letter:</label>
 <br>
<textarea id="cover letter" name="cover letter" rows="5" cols="40" placeholder="write your coverletter here..."></textarea>
<br>
<input type="submit" value="submit">    
</body>
</html>
